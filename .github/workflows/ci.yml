name: Pruebas automatizadas y de carga

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: iadb
          POSTGRES_PASSWORD: claveCI
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-retries 5

    env:
      PYTHONPATH: .
      DB_HOST: localhost
      DB_PORT: 5432
      DB_NAME: iadb
      DB_USER: postgres
      DB_PASSWORD: claveCI
      MOTOR_POR_DEFECTO: eco

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: pip install -r requirements.txt pytest httpx

      - name: Inicializar base de datos
        run: psql -h localhost -U postgres -d iadb -f db/init.sql
        env:
          PGPASSWORD: claveCI

      - name: Ejecutar pruebas
        run: pytest -v

